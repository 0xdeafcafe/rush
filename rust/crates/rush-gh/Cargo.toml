[package]
name = "rush-gh"
description = "asking GitHub through the gh command about pull requests, and holding a git push until its branch is quiet"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rush-core = { path = "../rush-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

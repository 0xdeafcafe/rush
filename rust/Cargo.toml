[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xdeafcafe/rush"

[workspace.dependencies]
rush-core = { path = "crates/rush-core" }
rush-hl = { path = "crates/rush-hl" }
rush-convo = { path = "crates/rush-convo" }
rush-claude = { path = "crates/rush-claude" }
rush-draw = { path = "crates/rush-draw" }
rush-ui = { path = "crates/rush-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-width = "0.2"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

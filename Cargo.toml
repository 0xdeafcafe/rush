[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/rush-plugin/tests/testdata/probe",
    # Plugins written in Rust: the crate for writing them, the examples,
    # and the skill's template, checked with the rest.
    "plugins/sdk",
    "plugins/examples/autodrafts",
    "plugins/examples/delegate",
    "plugins/examples/kanban",
    "plugins/examples/neighbours",
    "plugins/examples/reconnect",
    "plugins/skills/write-rush-plugin/templates/rust",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xdeafcafe/rush"

[workspace.dependencies]
rush-core = { path = "crates/rush-core" }
rush-hl = { path = "crates/rush-hl" }
rush-convo = { path = "crates/rush-convo" }
rush-claude = { path = "crates/rush-claude" }
rush-draw = { path = "crates/rush-draw" }
rush-ui = { path = "crates/rush-ui" }
rush-ui-base = { path = "crates/rush-ui-base" }
rush-ui-social = { path = "crates/rush-ui-social" }
rush-ui-settings = { path = "crates/rush-ui-settings" }
rush-ui-projects-machine = { path = "crates/rush-ui-projects-machine" }
rush-ui-plugin-ui = { path = "crates/rush-ui-plugin-ui" }
rush-ui-accounts = { path = "crates/rush-ui-accounts" }
rush-ui-session-cards = { path = "crates/rush-ui-session-cards" }
rush-ui-bars = { path = "crates/rush-ui-bars" }
rush-ui-list-extras = { path = "crates/rush-ui-list-extras" }
rush-ui-cmdbar = { path = "crates/rush-ui-cmdbar" }
rush-ui-session-core = { path = "crates/rush-ui-session-core" }
rush-sys = { path = "crates/rush-sys" }
rush-events = { path = "crates/rush-events" }
rush-gh = { path = "crates/rush-gh" }
rush-keymap = { path = "crates/rush-keymap" }
rush-net = { path = "crates/rush-net" }
rush-state = { path = "crates/rush-state" }
rush-update = { path = "crates/rush-update" }
rush-harnessup = { path = "crates/rush-harnessup" }
rush-fleet = { path = "crates/rush-fleet" }
rush-watch = { path = "crates/rush-watch" }
rush-prdrive = { path = "crates/rush-prdrive" }
rush-memory = { path = "crates/rush-memory" }
rush-voice = { path = "crates/rush-voice" }
base64 = "0.23"
flate2 = "1"
memchr = "2"
hashbrown = { version = "0.17", default-features = false }
compact_str = "0.8"
regex = "1"
# The hand-weighted log tagger behind the linetagPicks setting.
linetag = { git = "https://github.com/0xdeafcafe/linetag", rev = "c092657debf7b92ddd22892d31ad56acddee24dc" }
sha2 = "0.10"
unicode-segmentation = "1.10"
ureq = "3"
criterion = { version = "0.7", default-features = false }
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
unicode-width = "0.2"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

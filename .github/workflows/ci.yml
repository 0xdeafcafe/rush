name: CI

# Checks every push to main and to a rush/* branch: formatting, clippy and
# the tests, on a Mac (rush's home). A push to main also builds rush for
# Apple silicon and keeps it as the run's artifact, `rush-main`, which
# tools/install-ci.sh downloads and installs: the builds that would
# otherwise load the machine rush runs on.

on:
  push:
    branches: [main, "rush/**"]
    # The website builds in pages.yml; it doesn't need rush's tests.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch makes its older run moot; every push to main
  # gets its build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # rust-cache keeps the dependencies built; sccache keeps rush's own crates
  # too, in GitHub's cache, so a push rebuilds only the crates it changed.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The Rust the machine rush is worked on has (Homebrew's), so clippy
      # here and there agree; move it when Homebrew's moves.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      # GitHub's download of sccache sometimes answers 504; then build
      # uncached rather than fail the run before anything is built.
      - uses: mozilla-actions/sccache-action@v0.0.9
        id: sccache
        continue-on-error: true
      - name: Without sccache
        if: steps.sccache.outcome != 'success'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
          # Branches start from main's; only main saves, so the cache isn't
          # filled with every branch's copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        # Left out: shimmers_on_his_second hangs on the hour it runs at (the
        # mascot sleeps after 23:00); stuck_shell_is_stopped and
        # compacts_only_the_conversation_expected fail now and then on
        # their timing.
        run: |
          cargo test --workspace --locked --no-fail-fast -- \
            --skip shimmers_on_his_second \
            --skip stuck_shell_is_stopped \
            --skip compacts_only_the_conversation_expected
      - name: Cache use
        if: always()
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; else echo "no sccache, so built uncached"; fi

  build:
    # Main's build for Apple silicon, for install-ci.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin
      # GitHub's download of sccache sometimes answers 504; then build
      # uncached rather than fail the run before anything is built.
      - uses: mozilla-actions/sccache-action@v0.0.9
        id: sccache
        continue-on-error: true
      - name: Without sccache
        if: steps.sccache.outcome != 'success'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          # The release workflow's cache for the same target.
          key: aarch64-apple-darwin
      - name: Build
        # No RUSH_VERSION: a build of main isn't a release, so it never
        # updates itself; build.rs puts the commit in `rush --version`.
        run: |
          cargo build --release --locked -p rush --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/rush" dist/rush
          codesign --force --sign - dist/rush
          dist/rush --version
      - name: Cache use
        if: always()
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; else echo "no sccache, so built uncached"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rush-main
          path: dist/rush
          retention-days: 14
          if-no-files-found: error

<!doctype html>
<!-- The social card, public/og.png. Render at 1280x640:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1280,640 --screenshot=public/og.png "file://$PWD/og/og.html"
     Same tokens as the site (DESIGN.md): label yellow, label red, cap black. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: #ffe600; color: #111010; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 40px 64px; display: flex; flex-direction: column; }
  .mast { display: flex; justify-content: space-between; border-bottom: 3px solid #111010; padding-bottom: 14px; font-size: 22px; font-weight: 700; }
  .word { font-stretch: condensed; font-weight: 900; color: #e8231f; font-size: 300px; line-height: .74; letter-spacing: -.02em; margin: 44px 0 0 -10px; }
  h1 { font-stretch: condensed; font-weight: 900; font-size: 64px; line-height: .95; margin-top: 30px; max-width: 18ch; }
  code { position: absolute; right: 64px; bottom: 56px; background: #111010; color: #ffe600; font: 500 24px/1 ui-monospace, "SF Mono", Menlo, monospace; padding: 18px 22px; }
</style>
</head>
<body>
  <div class="mast"><span>For Macs with Apple silicon</span><span>rush.forbes.red</span></div>
  <div class="word">rush</div>
  <h1>Every coding agent you run, in one terminal.</h1>
  <code>brew install 0xdeafcafe/tap/rush</code>
</body>
</html>

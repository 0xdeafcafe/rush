<!doctype html>
<!-- Render from site/: Google Chrome --headless=new --hide-scrollbars --window-size=1280,640 --screenshot=public/og.png file://$PWD/og/og.html -->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>rush social card</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        background: #ffe600;
        color: #c21e16;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .band {
        background: #c21e16;
        color: #ffe600;
        padding: 18px 56px 14px;
        overflow: hidden;
      }
      .band p {
        font:
          76px/1 Impact,
          "Arial Narrow",
          sans-serif;
        transform: skewX(-12deg);
        white-space: nowrap;
        letter-spacing: -0.035em;
      }
      .band span {
        margin-left: 64px;
      }
      .body {
        padding: 48px 64px;
        position: relative;
        height: 532px;
      }
      h1 {
        font-size: 68px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        max-width: 12ch;
        font-weight: 800;
      }
      code {
        display: block;
        color: #21170a;
        font:
          20px/1.5 Menlo,
          monospace;
        margin-top: 32px;
      }
      .small {
        position: absolute;
        bottom: 32px;
        left: 64px;
        font-size: 16px;
        font-weight: 700;
      }
      img {
        position: absolute;
        width: 850px;
        height: auto;
        right: -140px;
        top: -8px;
      }
      .url {
        position: absolute;
        right: 64px;
        bottom: 32px;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="band">
      <p>GET THEM ALL IN.<span>EVERY LAST AGENT.</span></p>
    </div>
    <div class="body">
      <img src="../src/assets/bottle-still.png" alt="The yellow rush bottle" />
      <h1>Every coding agent.<br />Under one cap.</h1>
      <code>brew install 0xdeafcafe/tap/rush</code>
      <p class="small">AI HARNESS POLISHER<br />NOT FOR AGENT CONSUMPTION</p>
      <p class="url">rush.forbes.red</p>
    </div>
  </body>
</html>

[package]
name = "rush-bundled"
description = "the plugins that ship inside rush (drafts, queue, ts, the clean-ups, gate, search-guard, …), rush's own MCP server inside a session (agtools), and rush's Claude Code status line"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rush-core = { path = "../rush-core" }
rush-plugin = { path = "../rush-plugin" }
rush-state = { path = "../rush-state" }
rush-events = { path = "../rush-events" }
rush-sys = { path = "../rush-sys" }
rush-gh = { path = "../rush-gh" }
# Anthropic's image rule (patches, resize, tiers): one copy, efficiency's.
rush-efficiency = { path = "../rush-efficiency" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
libc = "0.2"
base64.workspace = true
# Images agents read, shrunk to WebP, and contact sheets (contextguard
# images.rs): image decodes and resizes, webp (libwebp, built from source)
# encodes lossy, which image's own WebP encoder can't; font8x8 captions.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webp = { version = "0.3", default-features = false }
font8x8 = { version = "0.3", default-features = false }

[dev-dependencies]
rush-testenv = { path = "../rush-testenv" }
tempfile = "3"
rush-plugind = { path = "../rush-plugind" }

[[test]]
name = "e2e"
harness = false

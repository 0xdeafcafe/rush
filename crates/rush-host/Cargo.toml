[package]
name = "rush-host"
description = "the host: the long-lived process a rush-mode session lives in, its socket protocol, and the UI's client to it"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rush-core.workspace = true
rush-convo.workspace = true
rush-fleet.workspace = true
rush-state.workspace = true
rush-events.workspace = true
rush-sys.workspace = true
rush-remind = { path = "../rush-remind" }
rush-net.workspace = true
rush-gate = { path = "../rush-gate" }
rush-bundled = { path = "../rush-bundled" }
rush-plugin = { path = "../rush-plugin" }
rush-room = { path = "../rush-room" }
rush-efficiency = { path = "../rush-efficiency" }
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
base64.workspace = true
libc.workspace = true
regex.workspace = true

[features]
# The fake agent and an in-process host for it, for other crates' tests.
fake = []

[dev-dependencies]
rush-testenv = { path = "../rush-testenv" }
rush-claude.workspace = true
tempfile.workspace = true

[[bench]]
name = "list"
harness = false

# How many threads an idle host runs: its own process, run with the fake
# agent (the workspace's tests turn `fake` on).
[[test]]
name = "threads"
required-features = ["fake"]

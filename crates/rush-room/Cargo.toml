[package]
name = "rush-room"
description = "The feed agents share: rush feed"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rush-core = { path = "../rush-core" }
rush-state = { path = "../rush-state" }
rush-events = { path = "../rush-events" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
libc = "0.2"

[dev-dependencies]
rush-testenv = { path = "../rush-testenv" }
tempfile = "3"

[package]
name = "rush-plugin-sdk"
description = "writing a rush plugin in Rust: the JSON-RPC connection on fd 3, the protocol's shapes, the sidebar rush's broker takes, and plugin.json"
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/0xdeafcafe/rush"

# Only serde and serde_json: a plugin is one small program that has to
# start in rush's sandbox, and needs nothing of rush's own crates.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

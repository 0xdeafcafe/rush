[package]
name = "notes"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
# rush's crate for plugins: the connection on fd 3, the protocol's shapes
# and plugin.json. Here it's the one in rush's repository; in a project of
# your own, take it from GitHub instead:
#   rush-plugin-sdk = { git = "https://github.com/0xdeafcafe/rush" }
rush-plugin-sdk = { path = "../../../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
